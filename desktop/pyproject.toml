[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fichacosto-desktop"
version = "0.1.0"
description = "FichaCosto Desktop - MVP offline para fichas de costos"
requires-python = ">=3.11"
dependencies = [
  "flet>=0.24,<0.25",
  "sqlcipher3-binary>=0.5.4",
  "jsonschema>=4.22",
  "cryptography>=42.0",
  "argon2-cffi>=23.1.0",
  "reportlab>=4.2",
  "pandas>=2.2",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
fichacosto = "fichacosto.app:ejecutar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fichacosto.licensing" = ["*.json"]
"fichacosto.backup" = ["schemas/*.json"]
"fichacosto.help" = ["*.json", "assets/*.png"]
